# ============================================================
#  wrangler.toml  –  Cloudflare Workers config
#  Thay YOUR-DATABASE-ID bằng ID thật từ dashboard D1
# ============================================================

name              = "quiz-worker"
main              = "_worker.js"
compatibility_date = "2024-11-01"

# ── Biến môi trường ────────────────────────────────────────
[vars]
ADMIN_TOKEN = "@admin"

# ── Kết nối D1 Database ────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "quiz-database"
database_id   = "469ce0bf-082f-49c8-aacc-8294760ec09f"
